import org.jetbrains.kotlin.gradle.dsl.JvmTarget

apply plugin: 'com.android.application'
apply plugin: 'org.jetbrains.kotlin.android'

/**
 * Host for Android App Links (https://<host>/... opens the app, section 14.2). Set APP_LINKS_HOST in gradle.properties or
 * with -PAPP_LINKS_HOST=app.example.com; the host must serve /.well-known/assetlinks.json (see api/src/modules/app-links).
 */
def appLinksHost = project.findProperty('APP_LINKS_HOST') ?: 'app.agentspace.example'

/**
 * Release version, passed by app/scripts/release-android.mjs (-PAPP_VERSION_CODE=10004 -PAPP_VERSION_NAME=1.0.4).
 * versionCode must only ever increase; the script derives it from the semver (major*10000 + minor*100 + patch).
 */
def appVersionCode = (project.findProperty('APP_VERSION_CODE') ?: '1').toInteger()
def appVersionName = project.findProperty('APP_VERSION_NAME') ?: '1.0'

/** Release signing: android/keystore.properties (git-ignored) or KEYSTORE_* environment variables (CI). */
def keystoreProps = new Properties()
def keystoreFile = rootProject.file('keystore.properties')
if (keystoreFile.exists()) keystoreFile.withInputStream { keystoreProps.load(it) }
def signingValue = { String name -> keystoreProps.getProperty(name) ?: System.getenv("KEYSTORE_${name.toUpperCase()}") }

android {
    namespace = "com.agentspace.app"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.agentspace.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode appVersionCode
        versionName appVersionName
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        manifestPlaceholders = [appLinksHost: appLinksHost]
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        release {
            def storePath = signingValue('storeFile')
            if (storePath) {
                storeFile rootProject.file(storePath)
                storePassword signingValue('storePassword')
                keyAlias signingValue('keyAlias')
                keyPassword signingValue('keyPassword')
            }
        }
    }
    buildTypes {
        release {
            if (signingValue('storeFile')) signingConfig signingConfigs.release
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

kotlin {
    compilerOptions {
        jvmTarget = JvmTarget.JVM_21
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')

    // In-app native code (app/src/main/java/com/agentspace/app)
    implementation "androidx.core:core-ktx:$androidxCoreVersion"
    implementation "androidx.work:work-runtime-ktx:2.10.5"
    // Same version as @capacitor/push-notifications; needed to extend its MessagingService.
    implementation "com.google.firebase:firebase-messaging:25.0.1"
    // Native voice mode (OpenAI Realtime over WebRTC, section 7.6)
    implementation "io.github.webrtc-sdk:android:144.7559.15"
    // On-device text recognition for scanned documents (section 14.3)
    implementation "com.google.mlkit:text-recognition:16.0.1"
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
