# Agent Space desktop packaging (§14.2). Signing / notarisation come from environment variables in CI:
#   Windows: CSC_LINK (path or base64 of the .pfx) + CSC_KEY_PASSWORD
#   Mac:     CSC_LINK + CSC_KEY_PASSWORD (Developer ID Application), APPLE_ID, APPLE_APP_SPECIFIC_PASSWORD, APPLE_TEAM_ID
# Without them, builds are unsigned (fine for local testing only).
appId: com.agentspace.desktop
productName: Agent Space
copyright: Copyright © Agent Space
directories:
  output: release
  buildResources: build
files:
  - dist/**
  - package.json
extraResources:
  - from: build/icon.png
    to: tray-icon.png
  - from: ../app/dist
    to: web
    filter: ["**/*"]
protocols:
  - name: Agent Space
    schemes: [agentspace]
asar: true
# Device tools (§14.3) native modules. Native code can't load from inside app.asar, so these are unpacked:
#   - @nut-tree-fork/libnut-* (input for control my computer): prebuilt N-API .node per platform
#   - uiohook-napi (detects the user's own mouse/keyboard input): N-API prebuilds/ loaded by node-gyp-build
#   - get-windows (frontmost app): N-API binding on Windows, a Swift helper binary (`main`) run with execFile on Mac
# All three are N-API (ABI-stable), so the prebuilt binaries work in Electron as-is: no electron-rebuild needed, and
# npmRebuild is off so packaging never tries to compile them (which would need a C++/Swift toolchain).
asarUnpack:
  - node_modules/@nut-tree-fork/libnut-*/**
  - node_modules/uiohook-napi/**
  - node_modules/get-windows/**
npmRebuild: false
win:
  icon: build/icon.png
  target: [nsis]
  artifactName: AgentSpace-Setup-${version}.${ext}
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
mac:
  icon: build/icon-mac.png
  target: [dmg, zip]
  category: public.app-category.productivity
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    NSMicrophoneUsageDescription: Agent Space uses the microphone for voice mode and voice notes.
    NSCameraUsageDescription: Agent Space uses the camera so you can send photos to your bots.
  notarize: false # set to true in CI with APPLE_ID / APPLE_APP_SPECIFIC_PASSWORD / APPLE_TEAM_ID
dmg:
  artifactName: AgentSpace-${version}.${ext}
# Automatic updates (electron-updater): configure a feed to enable, e.g.
# publish:
#   provider: generic
#   url: https://downloads.agentspace.example/desktop
publish: null
